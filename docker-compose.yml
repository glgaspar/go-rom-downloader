version: '3.8'

services:
  rom-downloader:
    build: .
    container_name: rom-downloader
    ports:
      - "8080:8080"
    volumes:
      - ./downloads:/downloads
      - ./roms:/roms
    environment:
      - PORT=8080
      - DOWNLOADS_DIR=/downloads
      - ROMS_DIR=/roms
      - ROMM_API_ADDR=http://localhost:3000
      - ROMM_API_KEY=
    restart: unless-stopped
